services:
  - type: web
    name: numerix-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --app-dir MAIN
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
