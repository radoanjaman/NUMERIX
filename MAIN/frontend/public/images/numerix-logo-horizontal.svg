<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="numHOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#F28500"/>
    </linearGradient>
    <filter id="hGlassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- EMBLEM ICON (Scaled to 46px height, centered vertically) -->
  <g transform="translate(4, 2) scale(0.21)" filter="url(#hGlassShadow)">
    <!-- Top-Left Quadrant (+) -->
    <path d="M 100 24 L 28 66 L 28 98 L 92 98 L 92 24 Z" 
          fill="url(#numHOrangeGrad)" stroke="#C85A17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 60 52 L 60 70 M 51 61 L 69 61" 
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Top-Right Quadrant (-) -->
    <path d="M 108 24 L 180 66 L 180 98 L 116 98 L 116 24 Z" 
          fill="url(#numHOrangeGrad)" stroke="#C85A17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 139 61 L 157 61" 
          stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Bottom-Left Quadrant (÷) -->
    <path d="M 28 114 L 28 146 L 100 188 L 100 114 L 28 114 Z" 
          fill="url(#numHOrangeGrad)" stroke="#C85A17" stroke-width="4" stroke-linejoin="round"/>
    <line x1="51" y1="151" x2="69" y2="151" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="60" cy="139" r="4" fill="#FFFFFF"/>
    <circle cx="60" cy="163" r="4" fill="#FFFFFF"/>

    <!-- Bottom-Right Quadrant (×) -->
    <path d="M 180 114 L 180 146 L 108 188 L 108 114 L 180 114 Z" 
          fill="url(#numHOrangeGrad)" stroke="#C85A17" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 139 142 L 157 160 M 157 142 L 139 160" 
          stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round"/>

    <!-- Dark Teal Mathematical Cross -->
    <rect x="98" y="6" width="12" height="198" rx="2" fill="#2E4A4D" stroke="#1F3639" stroke-width="2"/>
    <rect x="4" y="100" width="200" height="12" rx="2" fill="#2E4A4D" stroke="#1F3639" stroke-width="2"/>
  </g>

  <!-- NUMERIX Wordmark (Crisp for Dark Glassmorphism) -->
  <text x="60" y="34" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="3.5" 
        fill="#F5F7FA">NUMERIX</text>
</svg>